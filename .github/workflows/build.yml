name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify Xcode and SDK
        run: |
          xcodebuild -version
          xcodebuild -showsdks
          xcrun swift --version
          test "$(xcodebuild -version | head -1)" = 'Xcode 27.0'
          test "$(xcodebuild -version | tail -1)" = 'Build version 27A266a'
          test "$(xcrun --sdk macosx --show-sdk-version)" = '27.0'
      - name: Build Debug and run unit tests
        run: |
          xcodebuild -project Vanilla.xcodeproj -scheme Vanilla -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath "$RUNNER_TEMP/Vanilla-DerivedData" \
            -resultBundlePath "$RUNNER_TEMP/Vanilla-Tests.xcresult" \
            -onlyUsePackageVersionsFromResolvedFile test CODE_SIGNING_ALLOWED=NO
      - name: Compile Release
        run: |
          xcodebuild -project Vanilla.xcodeproj -scheme Vanilla -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/Vanilla-DerivedData" \
            -onlyUsePackageVersionsFromResolvedFile build CODE_SIGNING_ALLOWED=NO
      - name: Save test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results
          path: ${{ runner.temp }}/Vanilla-Tests.xcresult
          if-no-files-found: ignore
          retention-days: 7
