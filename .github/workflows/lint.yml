name: Lint Swift files

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/lint.yml
      - .swiftlint.yml
      - '**/*.swift'
  pull_request:
    paths:
      - .github/workflows/lint.yml
      - .swiftlint.yml
      - '**/*.swift'

permissions:
  contents: read

jobs:
  swiftlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install SwiftLint 0.63.2
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/realm/SwiftLint/releases/download/0.63.2/swiftlint_linux_amd64.zip \
            -o "$RUNNER_TEMP/swiftlint.zip"
          echo "dd1017cfd20a1457f264590bcb5875a6ee06cd75b9a9d4f77cd43a552499143b  $RUNNER_TEMP/swiftlint.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/swiftlint.zip" -d "$RUNNER_TEMP/swiftlint"
      - name: Run SwiftLint
        run: '"$RUNNER_TEMP/swiftlint/swiftlint" lint --strict'
